name: 🚀 Feature Request
description: Propose a new feature or enhancement for Sonic
title: "[Feat]: "
labels: ["feature", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature! Please fill out the form below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve?
      placeholder: Describe the pain point or use case
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe your suggested implementation approach
      placeholder: Be specific about what should change and why
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority Level
      options:
        - Low (nice to have)
        - Medium (important but not critical)
        - High (blocking workflow)
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope Checklist
      description: Which areas does this affect?
      options:
        - label: Library management
        - label: Download/intake
        - label: Export/transcoding
        - label: Metadata handling
        - label: UI/UX
        - label: Performance
        - label: Security

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you thought of other ways to solve this?
      placeholder: List any workarounds or alternative approaches

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any relevant screenshots, mockups, or examples
