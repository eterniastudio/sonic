name: 🐛 Bug Report
description: Report a bug or unexpected behavior in Sonic
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of what happened
      placeholder: What did you expect? What actually happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the issue
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Observe the error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Sonic Version
      placeholder: e.g., 0.2.3
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Include relevant system specs (CPU, RAM, storage type)
      placeholder: Any hardware details that might be relevant

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs/Error Messages
      description: Paste any error messages or log output
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Verification
      options:
        - label: I have searched existing issues and this hasn't been reported before
          required: true
        - label: I can reproduce this consistently
        - label: This is not related to network/connectivity issues
